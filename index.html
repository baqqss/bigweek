<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>bigweek</title>
    <link rel="icon" type="image/png" href="logo.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/font-w95fa/1.0.0/w95fa.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
</head>
<body>

    <main class="container">
        <div class="logo-container">
            <img src="logo_loading.gif" alt="bigweek logo" class="logo" onerror="this.style.display='none'; document.getElementById('logo-placeholder').style.display='block';">
            <div id="logo-placeholder" class="logo-fallback">BIGWEEK</div>
        </div>

        <h1 class="hero-title">COMING SOON</h1>
        
        <p class="tagline">
            Every project promises a big week ahead.<br>
            <span>We are the big week.</span>
        </p>

        <div class="social-links">
            <a href="https://x.com/bigweekxyz" target="_blank" rel="noopener noreferrer" class="btn">
                <span class="corner top-left"></span>
                <span class="corner top-right"></span>
                <span class="corner bottom-left"></span>
                <span class="corner bottom-right"></span>
                <span class="btn-text">x x x</span>
            </a>
        </div>
    </main>

    <canvas id="trail-canvas"></canvas>
    <div id="physics-canvas"></div>

    <script>
        const { Engine, Render, Runner, Bodies, Composite, Body, Vector } = Matter;

        const engine = Engine.create();
        const world = engine.world;

        engine.gravity.y = 0.35;

        const container = document.getElementById('physics-canvas');
        
        let width = window.innerWidth;
        let height = window.innerHeight;

        const render = Render.create({
            element: container,
            engine: engine,
            options: {
                width: width,
                height: height,
                wireframes: false,
                background: 'transparent'
            }
        });

        Render.run(render);
        const runner = Runner.create();
        Runner.run(runner, engine);

        const ground = Bodies.rectangle(width / 2, height + 30, width * 2, 60, { isStatic: true });
        const leftWall = Bodies.rectangle(-30, height / 2, 60, height * 2, { isStatic: true });
        const rightWall = Bodies.rectangle(width + 30, height / 2, 60, height * 2, { isStatic: true });
        Composite.add(world, [ground, leftWall, rightWall]);

        const burgers = [];

        function spawnBurger() {
            const x = Math.random() * (width - 60) + 30;
            
            const baseSize = width < 600 ? width * 0.015 : 10;
            const size = Math.random() * (width < 600 ? 3 : 6) + baseSize;
            
            const burger = Bodies.circle(x, -30, size, {
                restitution: 0.9,
                friction: 0.05,
                frictionAir: 0.02,
                density: 0.002,
                render: {
                    sprite: {
                        texture: 'logo.png',
                        xScale: (size * 2) / 100,
                        yScale: (size * 2) / 100
                    }
                }
            });

            burgers.push(burger);
            Composite.add(world, burger);
        }

        setInterval(spawnBurger, 220);

        // Hiukkasjälki
        const trailCanvas = document.getElementById('trail-canvas');
        const ctx = trailCanvas.getContext('2d');
        trailCanvas.width = width;
        trailCanvas.height = height;

        const particles = [];

        function createParticle(x, y) {
            const size = Math.random() * 4 + 4;
            particles.push({
                x: x,
                y: y,
                size: size,
                alpha: 0.8,
                vx: (Math.random() - 0.5) * 1.5,
                vy: (Math.random() - 0.5) * 1.5
            });
        }

        function animateTrail() {
            ctx.clearRect(0, 0, width, height);

            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.alpha -= 0.025;
                p.size *= 0.95;

                if (p.alpha <= 0 || p.size <= 0.5) {
                    particles.splice(i, 1);
                    continue;
                }

                ctx.fillStyle = `rgba(255, 153, 51, ${p.alpha})`;
                ctx.shadowColor = 'rgba(255, 153, 51, 0.6)';
                ctx.shadowBlur = 6;
                ctx.fillRect(p.x - p.size / 2, p.y - p.size / 2, p.size, p.size);
            }

            requestAnimationFrame(animateTrail);
        }
        animateTrail();

        let lastMousePos = { x: -1000, y: -1000 };
        let mouseVelocity = { x: 0, y: 0 };

        const handleMove = (clientX, clientY) => {
            const currentPos = { x: clientX, y: clientY };

            mouseVelocity = {
                x: currentPos.x - lastMousePos.x,
                y: currentPos.y - lastMousePos.y
            };
            lastMousePos = currentPos;

            createParticle(clientX, clientY);

            const radius = width < 600 ? 35 : 50;
            const mouseSpeed = Vector.magnitude(mouseVelocity);

            burgers.forEach(burger => {
                const distance = Vector.magnitude(Vector.sub(burger.position, currentPos));
                if (distance < radius) {
                    const pushDirection = Vector.normalise(Vector.sub(burger.position, currentPos));
                    const forceMagnitude = (1 - distance / radius) * (0.012 + mouseSpeed * 0.003);
                    const force = Vector.mult(pushDirection, forceMagnitude);

                    Body.applyForce(burger, burger.position, force);
                }
            });
        };

        window.addEventListener('mousemove', (e) => handleMove(e.clientX, e.clientY));

        window.addEventListener('touchstart', (e) => {
            if (e.touches.length > 0) {
                lastMousePos = { x: e.touches[0].clientX, y: e.touches[0].clientY };
            }
        }, { passive: false });

        window.addEventListener('touchmove', (e) => {
            if (e.touches.length > 0) {
                handleMove(e.touches[0].clientX, e.touches[0].clientY);
            }
        }, { passive: false });

        window.addEventListener('resize', () => {
            width = window.innerWidth;
            height = window.innerHeight;

            render.canvas.width = width;
            render.canvas.height = height;

            trailCanvas.width = width;
            trailCanvas.height = height;

            Body.setPosition(ground, Vector.create(width / 2, height + 30));
            Body.setPosition(rightWall, Vector.create(width + 30, height / 2));
        });
    </script>

</body>
</html>
